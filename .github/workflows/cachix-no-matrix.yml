name: "Cachix Binary Cache"
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Free Disk Space Before Build
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Install nix-fast-build
      run: nix --accept-flake-config profile install "github:Mic92/nix-fast-build"
    - uses: cachix/cachix-action@v17
      with:
        name: 0x006e-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        installCommand: nix profile install --accept-flake-config nixpkgs#cachix
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - run: nix-fast-build --skip-cached --flake .#packages --no-nom  --cachix-cache 0x006e-nix

  toplevel:
    # Build the full host closure so flake-update PRs are binary-cached
    # before merge (branch protection should require this job). Cachix
    # skips paths already on cache.nixos.org server-side and LRU-evicts
    # stale closures automatically, so the 5GB free tier only ever holds
    # the delta (patched kernel, nvidia modules, initrd, toplevel refs).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Free Disk Space Before Build
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Install nix-fast-build
      run: nix --accept-flake-config profile install "github:Mic92/nix-fast-build"
    - uses: cachix/cachix-action@v17
      with:
        name: 0x006e-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        installCommand: nix profile install --accept-flake-config nixpkgs#cachix
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - run: nix-fast-build --skip-cached --flake '.#nixosConfigurations.ntsv.config.system.build.toplevel' --no-nom --cachix-cache 0x006e-nix
