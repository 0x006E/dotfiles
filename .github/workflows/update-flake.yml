name: update-flake-lock
on:
  workflow_dispatch:
    inputs:
      bumpWhat:
        description: Which flake input? (leave blank for all)
        required: false
        type: string

  schedule:
    - cron: '0 0 * * *' # runs daily at 00:00
  push:
      # Scoped to main like ci.yml: bot force-pushes to long-lived stale
      # branches otherwise re-trigger this workflow spuriously (rewritten
      # refs evaluate broadly against paths filters).
      branches: [main]
      paths:
        - 'flake.nix'
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # No stored credentials: the updater actions push with
          # UPDATE_FLAKE_PAT themselves. Leaving this enabled stacks two
          # different Authorization headers and GitHub 400s the push.
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          # PAT (not GITHUB_TOKEN): PRs opened with it trigger workflows,
          # so CI validates bot PRs and auto-merge can fire. GITHUB_TOKEN
          # PRs are silently skipped by GitHub.
          token: ${{ secrets.UPDATE_FLAKE_PAT }}
          inputs: ${{ inputs.bumpWhat }}
          pr-labels: automated
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # No stored credentials: the updater actions push with
          # UPDATE_FLAKE_PAT themselves. Leaving this enabled stacks two
          # different Authorization headers and GitHub 400s the push.
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Update flake packages
        uses: 0x006e/nix-update-action@main
        with:
          # Re-exports carry no repo-owned version: their versions live in
          # nixpkgs and flow through lockfile PRs. Attempting nix-update on
          # them only produces eval errors, so skip them outright.
          blacklist: "zoho-mail,windsurf,zen-browser-unwrapped,catppuccin-cursors-latteDark,catppuccin-cursors-mochaLight,inkscape,papers"
          token: ${{ secrets.UPDATE_FLAKE_PAT }}
          pr-labels: automated
