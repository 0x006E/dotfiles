name: gradle-deps

# Self-healing for Gradle offline locks (pkgs/*/deps.json).
#
# `nix-update` only bumps version/rev/hash; it knows nothing about the
# mitm-cache lockfiles Gradle builds consume in the sandbox. So a bot bump
# (new upstream deps) or a flake.lock bump (new Gradle resolving old deps
# differently -- e.g. gradle 9.7.1 -> 9.8.0 demanding kotlin-reflect 2.4.10)
# breaks `toplevel` with "Could not find <coord>", and nothing in the update
# flow repairs it. This workflow closes that loop:
#
# - automatic: when a `ci` run fails on a same-repo PR, it reads the failed
#   toplevel build log (the `build.log` artifact ci uploads on failure,
#   falling back to the job log), checks the failure is a missing-dependency
#   error, refreshes every Gradle lock on the PR head, and pushes the fix
#   back.
# - manual: workflow_dispatch on any PR number, skips the log check and
#   refreshes unconditionally.
#
# Loop guard: at most two consecutive auto-fix commits at a PR head; the
# third failure gets a comment and a human. Fix commits go through the
# PAT (like the other bot flows) so CI re-runs on them.

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR to refresh Gradle locks on
        required: true
        type: string
      packages:
        description: "Space-separated package attrs (default: all with a lock)"
        required: false
        type: string
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: gradle-deps-${{ inputs.pr-number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve target PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted-ish text (inputs, ref names) goes through env, never
          # straight into the script body.
          PR_INPUT: ${{ inputs.pr-number }}
          CONCL: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PR_INPUT" ]; then
            if ! [[ "$PR_INPUT" =~ ^[0-9]+$ ]]; then
              echo "pr-number must be a number, got: $PR_INPUT" >&2
              exit 1
            fi
            HEAD_REF=$(gh pr view "$PR_INPUT" --json headRefName -q .headRefName)
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_INPUT" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=auto" >> "$GITHUB_OUTPUT"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "$CONCL" != "failure" ]; then
            echo "ci concluded $CONCL, nothing to do."
            exit 0
          fi
          # workflow_run on main sees PR metadata only for PR-triggered runs.
          PR=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          HEAD_REPO=$(jq -r '.workflow_run.head_repository.full_name // empty' "$GITHUB_EVENT_PATH")
          HEAD_REF=$(jq -r '.workflow_run.pull_requests[0].head.ref // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR" ]; then
            echo "failed run is not attached to a PR, nothing to do."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR head is a fork ($HEAD_REPO), cannot push there."
            exit 0
          fi
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(gh pr view "$PR" --json headRefName -q .headRefName)
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Failure is a missing-dependency error
        id: failure
        if: steps.target.outputs.proceed == 'true' && steps.target.outputs.mode == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          # Find the failed toplevel job of the triggering run and scan its
          # log. Only a Gradle resolution failure qualifies for an automatic
          # lock refresh; anything else exits quietly (a human owns it).
          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          JOB_ID=$(echo "$JOBS" | jq -r '.jobs[] | select(.name == "toplevel" and .conclusion == "failure") | .id' | head -1)
          if [ -z "$JOB_ID" ]; then
            echo "no failed toplevel job, nothing to do."
            exit 0
          fi
          # Preferred source: the build.log artifact ci uploads on failure.
          # It holds the complete per-derivation Nix logs, whereas the job
          # log only keeps the last 10k lines of the toplevel build, so the
          # failing Gradle derivation can scroll out of it.
          rm -f fail.log
          mkdir -p artifact-logs
          if gh run download "$RUN_ID" --repo "$REPO" --name build.log --dir artifact-logs 2>/dev/null; then
            ART=$(find artifact-logs -type f -name build.log | head -1)
            if [ -n "$ART" ] && [ -s "$ART" ]; then
              echo "using build.log artifact."
              mv "$ART" fail.log
            fi
          fi
          if [ ! -s fail.log ]; then
            echo "no build.log artifact, falling back to the job log."
            EXTRA_FLAGS=()
            if gh api --help | grep -q -- '--allow-escape-sequences'; then
              EXTRA_FLAGS+=("--allow-escape-sequences")
            fi
            gh api "${EXTRA_FLAGS[@]}" "repos/$REPO/actions/jobs/$JOB_ID/logs" > fail.log
          fi
          # Real signatures seen in the wild (PR #146): Gradle's
          # "Could not resolve all artifacts for configuration" +
          # "Could not find group:name:version". A bare hash-mismatch on a
          # *-deps fixed-output derivation qualifies too.
          echo "deps=false" >> "$GITHUB_OUTPUT"
          if grep -a -q "Could not resolve all artifacts for configuration" fail.log \
            || grep -a -qE "Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+" fail.log \
            || grep -a -qE "hash mismatch in fixed-output derivation.*-deps" fail.log; then
            echo "deps failure confirmed."
            grep -a -oE "Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+" fail.log \
              | sed 's/\.$//' | sort -u | head -5 | tee coords.txt || true
            if [ ! -s coords.txt ]; then
              grep -a -oE "hash mismatch in fixed-output derivation '[^']+'" fail.log | head -5 | tee coords.txt || true
            fi
            {
              echo "coords<<EOF"
              cat coords.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "toplevel failed for a non-dependency reason, leaving it to humans."
            exit 0
          fi

      - name: Checkout PR head
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true')
        uses: actions/checkout@v7
        with:
          # PAT, not GITHUB_TOKEN: the fix commit must re-trigger CI, and
          # GITHUB_TOKEN pushes do not trigger workflows.
          token: ${{ secrets.UPDATE_FLAKE_PAT }}
          fetch-depth: 0
          ref: ${{ steps.target.outputs.head_ref }}

      - name: Loop guard
        if: >
          steps.target.outputs.proceed == 'true' &&
          steps.target.outputs.mode == 'auto' &&
          steps.failure.outputs.deps == 'true'
        id: guard
        run: |
          # At most two consecutive auto-fix commits: a third identical
          # failure means the refresh is not converging, stop pushing.
          COUNT=0
          while IFS= read -r msg; do
            case "$msg" in
              "[gradle-deps-auto]"*) COUNT=$((COUNT + 1)) ;;
              *) break ;;
            esac
          done < <(git log -3 --format=%s 2>/dev/null)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 2 ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "two auto-fix commits already at head and CI still fails."
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment and stop when not converging
        if: >
          steps.target.outputs.proceed == 'true' &&
          steps.target.outputs.mode == 'auto' &&
          steps.failure.outputs.deps == 'true' &&
          steps.guard.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPDATE_FLAKE_PAT }}
          PR: ${{ steps.target.outputs.pr }}
          COORDS: ${{ steps.failure.outputs.coords }}
        run: |
          MARK="<!-- gradle-deps-autofix -->"
          if ! gh pr view "$PR" --json comments \
            -q '.comments[].body' | grep -q "$MARK"; then
            gh pr comment "$PR" --body "$MARK
          The Gradle lock auto-fix already pushed twice and CI still fails.
          $COORDS
          A human needs to look at this one."
          fi
          exit 0

      - name: Free disk space before build
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true') &&
          steps.guard.outputs.stop != 'true'
        run: |
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost
          sudo apt-get clean

      - uses: DeterminateSystems/determinate-nix-action@v3
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true') &&
          steps.guard.outputs.stop != 'true'

      # Pull-only Cachix is the whole cache story here. Magic Nix Cache is
      # gone, and a cache-nix-action save is deliberately not used: this job
      # runs rarely, and a multi-GB save would push ci's toplevel cache out
      # of the repo's 10 GB Actions cache quota.
      - uses: cachix/cachix-action@v17
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true') &&
          steps.guard.outputs.stop != 'true'
        with:
          name: 0x006e-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Refresh Gradle locks
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true') &&
          steps.guard.outputs.stop != 'true'
        env:
          PKGS_INPUT: ${{ inputs.packages }}
        run: |
          if [ -n "$PKGS_INPUT" ]; then
            if ! [[ "$PKGS_INPUT" =~ ^[A-Za-z0-9_.\ -]+$ ]]; then
              echo "packages must be space-separated package attr names" >&2
              exit 1
            fi
            PKGS="$PKGS_INPUT"
          else
            # Every package dir carrying a mitm-cache lockfile.
            PKGS=$(for d in pkgs/*/deps.json; do [ -e "$d" ] && basename "$(dirname "$d")"; done)
          fi
          echo "refreshing: $PKGS"
          for pkg in $PKGS; do
            if ! nix eval ".#$pkg.mitmCache.updateScript" --apply 's: "ok"' 2>/dev/null; then
              echo "$pkg has no updateScript, skipping."
              continue
            fi
            SCRIPT=$(nix build ".#$pkg.mitmCache.updateScript" --print-out-paths --no-link)
            # The script writes pkgs/<pkg>/deps.json in place; ~15 min.
            "$SCRIPT" || echo "$pkg refresh failed, continuing with the rest."
          done
          git status --porcelain -- pkgs/

      - name: Push fix or report
        if: >
          steps.target.outputs.proceed == 'true' &&
          (steps.target.outputs.mode == 'manual' || steps.failure.outputs.deps == 'true') &&
          steps.guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPDATE_FLAKE_PAT }}
          MODE: ${{ steps.target.outputs.mode }}
          PR: ${{ steps.target.outputs.pr }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          COORDS: ${{ steps.failure.outputs.coords }}
        run: |
          if [ -z "$(git status --porcelain -- pkgs/)" ]; then
            echo "refresh produced no changes."
            MARK="<!-- gradle-deps-autofix -->"
            if [ "$MODE" = "auto" ] \
              && ! gh pr view "$PR" --json comments \
                -q '.comments[].body' | grep -q "$MARK"; then
              gh pr comment "$PR" --body "$MARK
          CI failed with a dependency error but refreshing the Gradle
          locks produced no new entries:
          $COORDS
          The missing artifact may be genuinely unreachable, or the
          failure needs a human."
            fi
            exit 0
          fi
          git add pkgs/
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "[gradle-deps-auto] refresh Gradle offline locks" \
            -m "Automatic refresh after a CI dependency failure." \
            -m "Failing coordinates:" \
            -m "$COORDS"
          git push origin "HEAD:refs/heads/$HEAD_REF"
