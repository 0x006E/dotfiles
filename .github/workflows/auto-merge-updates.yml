name: auto-merge-updates

# Auto-merge bot PRs (flake.lock / package updates) once required checks
# (incl. the Cachix toplevel build) go green. Human PRs are unaffected.
# Requires "Allow auto-merge" + branch protection on main (repo settings).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  automerge:
    # Updater PRs are authored by github-actions[bot], or by the repo
    # owner when opened via PAT (required so bot PRs trigger workflows).
    # Branch prefixes cover update-flake-lock, nix-update-action
    # (chore/nix_update_actions), owner fix branches (fix/...) and
    # similar. Tighten if a bot PR ever falls outside these (it just
    # won't auto-merge).
    if: >
      (github.actor == 'github-actions[bot]' ||
       github.actor == github.repository_owner) &&
      (startsWith(github.head_ref, 'update-') ||
       startsWith(github.head_ref, 'update_') ||
       startsWith(github.head_ref, 'chore/') ||
       startsWith(github.head_ref, 'fix/') ||
       contains(github.head_ref, 'flake-lock') ||
       contains(github.head_ref, 'flake_lock'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # PAT, not GITHUB_TOKEN: auto-merge performed with the default token
      # suppresses the push event on main, so ci.yml's pin step (which only
      # runs on push to main) would never execute. The PAT makes the merge
      # trigger the post-merge ci run, exactly once per merged PR.
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.UPDATE_FLAKE_PAT }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: merge
