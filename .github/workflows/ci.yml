name: ci

# CI pipeline: fast check gates the slow toplevel build, so a broken tree
# fails in ~3 min instead of burning the ~10 min host build. check must
# stay full (not --no-build): stylix's nixvim target realizes a derivation
# at eval time (IFD), which --no-build forbids on cold stores. Job IDs are
# stable on purpose: branch protection refers to them by name.
on:
  pull_request:
  push:
    # Scoped to main: without this, every PR branch push fires both the
    # push and pull_request events -> duplicate check runs (and double
    # kernel compiles). PRs report via pull_request; main pushes (merge
    # commits, direct pushes) report via push, which is also what the
    # pin step requires.
    branches: [main]
  workflow_dispatch:

# Supersede stale PR runs (every bot push / fix commit starts a new one and
# the old toplevel build is wasted minutes). Never cancel main: those runs
# pin the closure. A cancelled run concludes "cancelled", so gradle-deps
# (which reacts to "failure" only) ignores it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # cache-nix-action purges superseded caches via the Actions cache API.
      # (No id-token: FlakeHub is not used, and without an OIDC token
      # Determinate Nix does not attempt a FlakeHub login at all.)
      actions: write
    steps:
      - uses: actions/checkout@v7
      # Persist the flake evaluator (Git/fetcher) cache: without this,
      # every job re-downloads + re-unpacks all inputs ("unpacking ...
      # into the Git cache"). /nix/store is shared via cache-nix-action
      # + cachix; this covers ~/.cache/nix instead.
      # Safe across lock changes: nix verifies narHash on use, and the
      # key misses on a new flake.lock.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix/tarballs
            ~/.cache/nix/gitv3
          key: nix-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-eval-${{ runner.os }}-
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Pull-only: reuse paths previous runs pushed (e.g. the kernel)
      # instead of compiling them a second time on this runner.
      - uses: cachix/cachix-action@v17
        with:
          name: 0x006e-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      # Restore + save /nix as ONE GitHub Actions cache (no per-path
      # uploads, so no Magic Nix Cache rate limiting). Separate keys per
      # job: if check and toplevel shared one, whichever saved first would
      # make the other see a hit and never save its own paths. Post-save
      # only runs when the job succeeds, which is fine for the fast gate.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          # No exact hit (new flake.lock): start from the latest older one.
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          # Keep only the newest cache of this kind.
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Full check (NOT --no-build): stylix's nixvim target realizes a
      # derivation at eval time (IFD), which --no-build forbids on cold
      # stores. The cachix pull above keeps this download-fast.
      - run: nix flake check

  toplevel:
    # Build the full host closure so flake-update PRs are binary-cached
    # before merge (branch protection should require this job). Cachix
    # skips paths already on cache.nixos.org server-side and LRU-evicts
    # stale closures automatically, so the 5GB free tier only ever holds
    # the delta (out-of-tree modules, nvidia, initrd, toplevel refs).
    needs: [check]
    runs-on: ubuntu-latest
    # The failing run took ~100 min; this is headroom, not a target. A hung
    # build should not burn the 6 h default.
    timeout-minutes: 180
    permissions:
      contents: read
      # cache-nix-action purges superseded caches via the Actions cache API.
      actions: write
    steps:
    - uses: actions/checkout@v7
    # Same evaluator-cache rationale as the check job above; also speeds
    # up the nix-fast-build profile install below (fewer refetches).
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/nix/tarballs
          ~/.cache/nix/gitv3
        key: nix-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-keys: |
          nix-eval-${{ runner.os }}-
    - name: Free Disk Space Before Build
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h
    - uses: DeterminateSystems/determinate-nix-action@v3
    # Restore only here; the save step is at the very end with always().
    # The combined action's post-save is success()-only, and this job is
    # the one that fails after a long source build, so a failed run would
    # otherwise throw away everything it compiled.
    - name: Restore Nix store
      id: nix-cache
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-toplevel-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-toplevel-${{ runner.os }}-
    - name: Install nix-fast-build
      run: nix --accept-flake-config profile install "github:Mic92/nix-fast-build"
    - uses: cachix/cachix-action@v17
      with:
        name: 0x006e-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        installCommand: nix profile install --accept-flake-config nixpkgs#cachix
    - run: nix-fast-build --skip-cached --flake '.#nixosConfigurations.ntsv.config.system.build.toplevel' --no-nom --cachix-cache 0x006e-nix
    # nix-fast-build only keeps the last 10k lines of the toplevel build in
    # its own output, so a failure deep in a long build scrolls out of the
    # job log. Nix itself keeps the full per-derivation logs (failed ones
    # included) under /nix/var/log/nix/drvs: on failure only, collect them,
    # oldest first so the failure lands at the bottom, and upload as
    # build.log. continue-on-error: a log hiccup must not mask the real result.
    - name: Collect build logs
      if: failure()
      continue-on-error: true
      run: |
        sudo find /nix/var/log/nix/drvs -type f -printf '%T@ %p\0' 2>/dev/null \
          | sort -z -n | cut -z -d' ' -f2- \
          | while IFS= read -r -d '' f; do
              printf '\n===== %s =====\n' "$f"
              sudo bzcat -f "$f" 2>/dev/null || true
            done > build.log
        ls -lh build.log
    - name: Upload build.log
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: build.log
        path: build.log
        if-no-files-found: warn
        retention-days: 7
    # Pin the merged-main closure (current + previous) so GC can never
    # evict the generations you actually run. PR runs skip this step.
    - name: Pin main closure
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      run: |
        TOP=$(nix build '.#nixosConfigurations.ntsv.config.system.build.toplevel' --print-out-paths --no-link)
        cachix pin 0x006e-nix main "$TOP" --keep-revisions 2
    # Save even when the build failed (see the restore step). No
    # gc-max-store-size on purpose: GC would delete the freshly built,
    # unrooted outputs this cache exists to keep. Skipped on an exact key
    # hit, since a cache with the same key can't be overwritten.
    - name: Save Nix store
      if: always() && steps.nix-cache.outputs.hit-primary-key != 'true'
      continue-on-error: true
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: ${{ steps.nix-cache.outputs.primary-key }}
        purge: true
        purge-prefixes: nix-toplevel-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
