id = "ntsv/nixos-updates"
name = "NixOS Updates"
version = "1.0.0"
plugin_api = 26
author = "ntsv"
license = "MIT"
icon = "package"
description = "Tracks nixpkgs flake inputs vs upstream HEAD, dotfiles CI status and open PRs. GitHub REST, no auth. Polls every 30 min, click to check now."
tags = [ "nix", "updates", "github" ]

# Plugin-level settings: one set shared by every entry, edited from
# Settings → Plugins, readable via noctalia.getConfig in widget.luau.
[[setting]]
key = "flake_path"
type = "string"
label_key = "settings.flake_path.label"
description_key = "settings.flake_path.description"
default = "/home/nithin/nix"

[[setting]]
key = "poll_minutes"
type = "int"
label_key = "settings.poll_minutes.label"
description_key = "settings.poll_minutes.description"
default = 30
min = 5
max = 720

[[setting]]
key = "dotfiles_repo"
type = "string"
label_key = "settings.dotfiles_repo.label"
description_key = "settings.dotfiles_repo.description"
default = "0x006E/dotfiles"

[[setting]]
key = "max_inputs"
type = "int"
label_key = "settings.max_inputs.label"
description_key = "settings.max_inputs.description"
default = 12
min = 1
max = 25

# Headless poller: owns GitHub polling, notifications and the shared
# snapshot. The widget and panel below are thin renderers.
[[service]]
id = "fetcher"
entry = "service.luau"

[[panel]]
id = "main"
entry = "panel.luau"
width = 400
height = 560
placement = "attached"
open_near_click = true

[[widget]]
id = "updates"
entry = "widget.luau"

  # Right-click opens the repo PR list; left-click (onClick) forces a check.
  [widget.actions]
  right = "exec /run/current-system/sw/bin/xdg-open https://github.com/0x006E/dotfiles/pulls"
